name: release

# Publishes @ararat-network/sdk to npm from a v* tag, with provenance. The tag
# must name the version in package.json. npm's trusted publishing for this
# repository and workflow must be configured on the package first; until it is,
# the publish step fails and nothing else is affected.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: The tag names the package's version
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
      - run: pnpm check:package
      - run: npm publish --provenance --access public
