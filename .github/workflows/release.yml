name: release

# Stages @ararat-network/sdk on npm from a v* tag, with provenance. The tag
# must name the version in package.json and sit on main, so nothing is staged
# that the pull request gate never saw, and every check ci.yml runs is run
# again from the tag. The workflow stages and never publishes: the version
# becomes public only when a maintainer approves it with `npm stage approve`
# and two-factor authentication, so no run can release on its own. npm's
# trusted publisher for this repository and workflow must allow staged
# publishing; until it does, the stage step fails and nothing else is
# affected.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  stage:
    name: Stage on npm
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: The tag names the package's version
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - name: The tagged commit is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - run: pnpm gen
      - run: pnpm gen:check
      - run: pnpm fixtures:check
      - run: pnpm lint
      - run: pnpm check
      - run: pnpm test:coverage
      - run: pnpm build
      - run: pnpm check:package
      - run: pnpm check:browser
      - run: npm stage publish --provenance --access public
