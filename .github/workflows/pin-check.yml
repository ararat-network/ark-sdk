name: pin-check

# Weekly, and on demand: does ark's newest chain tag change what this SDK
# generates? src/gen is generated at ARK_VERSION; this job generates at the
# newest v* tag instead and fails if anything differs, so a chain release
# whose pin bump was forgotten shows within a week. It holds no token and
# opens nothing: the bump is a pull request a person makes.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  latest:
    name: Generate at ark's newest tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - id: tags
        name: Resolve the pinned and the newest chain tag
        run: |
          pinned=$(cat ARK_VERSION)
          # Version sort ranks v0.1.0-alpha.1 above v0.1.0, since a hyphen
          # sorts after the end of a string; a tilde sorts below everything,
          # as Debian versions use it, so the hyphen becomes one while sorting.
          newest=$(git ls-remote --tags --refs https://github.com/ararat-network/ark.git 'refs/tags/v*' \
            | awk -F/ '{print $NF}' | sed 's/-/~/' | sort -V | tail -n 1 | sed 's/~/-/')
          echo "pinned=$pinned" >> "$GITHUB_OUTPUT"
          echo "newest=$newest" >> "$GITHUB_OUTPUT"
          echo "pinned $pinned, newest $newest"
      # Every input, in buf.gen.yaml's order, so the shared files come from the
      # same pins that produced the committed output; the ark input alone would
      # regenerate them from ark's buf.lock and could differ for that reason.
      - name: Generate at the newest tag
        run: |
          sed -i "s#tag: ${{ steps.tags.outputs.pinned }}#tag: ${{ steps.tags.outputs.newest }}#" buf.gen.yaml
          pnpm gen
      - name: Compare
        run: |
          if ! ./scripts/check-clean.sh src/gen src/codec/files.ts; then
            echo "::error::ark ${{ steps.tags.outputs.newest }} changes the generated code; ARK_VERSION is ${{ steps.tags.outputs.pinned }}. Move the pin and regenerate."
            exit 1
          fi
